<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme – Sign in</title>
  <style>body { font-family: system-ui, sans-serif; max-width: 420px; margin: 48px auto; } label, button { display: block; margin-top: 12px; } input { width: 100%; padding: 8px; }</style>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <p role="alert" hidden>Invalid email or password</p>
  </form>
  <script>
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      const ok = document.getElementById("email").value === "alex@example.com"
        && document.getElementById("password").value === "correct-horse";
      document.querySelector("[role=alert]").hidden = ok;
      if (ok) {
        localStorage.setItem("acme-session", "alex");
        location.href = "account.html";
      }
    });
  </script>
</body>
</html>
